services:
  app:
    build: .
    image: patchbay:m0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./workflows:/app/workflows:ro
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, "-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 5
